<section class="overview-grid">
  <article class="overview-block">
    <h3>
      <lucide-icon [img]="frontIcon" size="16"></lucide-icon>
      O que e a plataforma
    </h3>
    <p>
      Painel para orquestrar mutation tests e acompanhar, em um unico lugar, configuracao do projeto,
      metricas e comparacao de testes.
    </p>
  </article>

  <article class="overview-block">
    <h3>
      <lucide-icon [img]="apiIcon" size="16"></lucide-icon>
      Fluxo Frontend e API
    </h3>

    <ol>
      <li *ngFor="let step of steps">
        <strong>{{ step.title }}</strong>
        <span>{{ step.detail }}</span>
        <code>{{ step.endpoint }}</code>
      </li>
    </ol>
  </article>
</section>
